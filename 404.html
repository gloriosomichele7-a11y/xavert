<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#dc2626" />
    <title>XAVERT | Page Not Found</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #111827;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      main {
        width: min(100%, 620px);
        padding: clamp(28px, 6vw, 56px);
        border: 1px solid #e5e7eb;
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 18px 50px rgb(15 23 42 / 8%);
        text-align: center;
      }

      .brand {
        margin: 0 0 24px;
        color: #dc2626;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 0.14em;
      }

      h1 {
        margin: 0;
        font-size: clamp(42px, 9vw, 72px);
        line-height: 1;
      }

      p {
        margin: 20px 0 28px;
        color: #64748b;
        font-size: 17px;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 20px;
        border-radius: 10px;
        background: #dc2626;
        color: #ffffff;
        font-weight: 800;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        background: #b91c1c;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">XAVERT</p>
      <h1>404</h1>
      <p>The page you requested could not be found.</p>
      <a href="/">Back to XAVERT Home</a>
    </main>
  </body>
</html>
