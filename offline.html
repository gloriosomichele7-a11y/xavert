<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#dc2626" />
    <title>You're offline | XAVERT</title>
    <meta name="description" content="This XAVERT page needs an internet connection. Try again when connected." />
    <style>
      :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: light; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 20px; background: #f7f8fb; color: #172033; }
      main { width: min(100%, 550px); background: white; border: 1px solid #e5e7eb; border-radius: 20px; padding: clamp(26px, 6vw, 46px); box-shadow: 0 12px 40px rgb(17 24 39 / 7%); }
      .brand { font-weight: 850; color: #dc2626; letter-spacing: .13em; text-decoration: none; font-size: 19px; }
      h1 { margin: 24px 0 12px; font-size: clamp(27px, 5vw, 36px); letter-spacing: -.035em; }
      p { line-height: 1.65; color: #4b5563; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
      .action { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; padding: 11px 20px; border-radius: 10px; text-decoration: none; font-weight: 700; }
      .primary { color: #fff; background: #dc2626; }
      .secondary { color: #172033; border: 1px solid #d1d5db; background: white; }
      .action:focus-visible { outline: 3px solid #172033; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/">XAVERT</a>
      <h1>You're offline</h1>
      <p>The page you requested is not saved on this device. Reconnect to the internet and try again.</p>
      <p>Some XAVERT tools also need to download software libraries before they can work.</p>
      <div class="actions">
        <a class="action primary" href="/">Open XAVERT home</a>
        <button class="action secondary" type="button" id="retry">Try again</button>
      </div>
    </main>
  <script>document.getElementById("retry").addEventListener("click", () => location.reload());</script>
  </body>
</html>
